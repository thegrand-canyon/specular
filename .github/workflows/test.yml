name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hardhat:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Compile
        run: npx hardhat compile

      - name: Test (unit + integration)
        run: npx hardhat test

      - name: API tx-builder tests
        run: npx mocha test/api/*.test.js
        # API tests spawn the server process; mocha runs them top-level

  # The agent server builds from the ABIs committed under mcp-server/abi/, so it
  # needs neither the root install nor a hardhat compile. It was previously not
  # covered by CI at all.
  mcp-server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mcp-server/package-lock.json
      - run: npm ci
        working-directory: mcp-server
      - run: npm run build
        working-directory: mcp-server
      - run: npm test
        working-directory: mcp-server
      - name: ABIs match the compiled artifacts
        run: |
          npm ci
          npx hardhat compile
          node mcp-server/scripts/extract-abis.mjs
          git diff --exit-code -- mcp-server/abi

  # test/foundry/ (invariants, gas, DoS, soak, storage) had no CI coverage.
  # forge auto-installs lib/forge-std; npm ci is required because foundry.toml
  # remaps @openzeppelin/ into node_modules/.
  foundry:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge test -vv

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r python/requirements.txt pytest
      - run: python -m pytest python/tests -q
